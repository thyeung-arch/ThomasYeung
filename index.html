<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>屋企洗費表｜居家帳簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F6F2EA;
    --surface:#FFFFFF;
    --ink:#3E3A33;
    --ink-soft:#8A8271;
    --line:#E4DDCF;
    --sage:#8FA083;
    --sage-soft:#DCE5D6;
    --rose:#C98A7A;
    --rose-soft:#F1DCD4;
    --sky:#8DA6B2;
    --mustard:#D8B675;
    --plum:#A793A6;
    --taupe:#B7A38C;
    --danger:#C1766A;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .wrap{
    max-width:1040px;
    margin:0 auto;
    padding:56px 24px 100px;
  }

  /* ---------- Header ---------- */
  header{
    position:relative;
    margin-bottom:40px;
    padding-bottom:28px;
  }
  .tape{
    position:absolute;
    top:-18px;
    width:120px;
    height:34px;
    background:var(--mustard);
    opacity:.55;
    transform:rotate(-4deg);
    border-radius:2px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .tape.t2{
    left:210px;
    top:-14px;
    background:var(--rose);
    opacity:.45;
    transform:rotate(3deg);
    width:90px;
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:.22em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin:18px 0 10px;
    font-weight:600;
  }
  h1{
    font-family:"Noto Serif TC", serif;
    font-weight:700;
    font-size:44px;
    margin:0 0 12px;
    line-height:1.25;
    position:relative;
    display:inline-block;
  }
  h1 .swash{
    display:block;
    width:168px;
    height:10px;
    margin-top:2px;
  }
  header p.sub{
    color:var(--ink-soft);
    font-size:15px;
    margin:0;
    max-width:520px;
    line-height:1.7;
  }
  header{border-bottom:1px solid var(--line);}
  .month-row{
    display:flex;align-items:center;gap:10px;
    margin-top:20px;
    font-size:14.5px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .month-row select{
    font-family:"Noto Serif TC", serif;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    background:var(--sage-soft);
    border:1px solid var(--sage);
    border-radius:8px;
    padding:6px 12px;
    cursor:pointer;
  }
  .month-row select:focus{outline:2px solid var(--sage); outline-offset:1px;}
  .month-year{font-weight:400;}

  /* ---------- Summary card ---------- */
  .summary{
    display:grid;
    grid-template-columns: 1.1fr 1.4fr;
    gap:20px;
    margin:36px 0 44px;
  }
  @media (max-width:720px){ .summary{grid-template-columns:1fr;} }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:24px 26px;
    box-shadow:0 1px 2px rgba(62,58,51,.04);
  }
  .stamp-card{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .stamp-row{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .stamp{
    width:64px;height:64px;
    border-radius:50%;
    background:var(--sage-soft);
    border:2px dashed var(--sage);
    display:flex;align-items:center;justify-content:center;
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:13px;
    color:var(--sage);
    flex-shrink:0;
    text-align:center;
    line-height:1.3;
  }
  .stamp-label{font-size:13px;color:var(--ink-soft);margin-bottom:2px;}
  .stamp-value{font-family:"Noto Serif TC",serif;font-size:26px;font-weight:700;}
  .budget-input-row{
    display:flex;align-items:center;gap:10px;
    font-size:14px;color:var(--ink-soft);
    margin-top:4px;
  }
  .budget-input-row input{
    font-family:"Noto Sans TC",sans-serif;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 10px;
    width:140px;
    background:#FBF9F4;
  }
  .budget-input-row input:focus{outline:2px solid var(--sage); outline-offset:1px;}

  .progress-track{
    height:12px;
    background:#EFEAE0;
    border-radius:99px;
    overflow:hidden;
    margin-top:6px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--sage), var(--sky));
    border-radius:99px;
    transition:width .35s ease;
  }
  .progress-fill.over{background:linear-gradient(90deg, var(--rose), var(--danger));}
  .progress-caption{
    display:flex;justify-content:space-between;
    font-size:12.5px;color:var(--ink-soft);margin-top:8px;
  }

  .breakdown-card .stamp-label{margin-bottom:10px;}
  .mini-legend{
    display:flex;flex-wrap:wrap;gap:8px 16px;
  }
  .mini-legend-item{
    display:flex;align-items:center;gap:7px;
    font-size:13px;color:var(--ink);
  }
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

  /* ---------- Table ---------- */
  .table-card{padding:0;overflow:hidden;}
  .table-head-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:22px 26px 0;
  }
  .table-head-row h2{
    font-family:"Noto Serif TC",serif;
    font-size:20px;margin:0;
    font-weight:600;
  }
  table{width:100%;border-collapse:collapse;margin-top:16px;}
  thead th{
    text-align:left;
    font-size:12.5px;
    letter-spacing:.06em;
    color:var(--ink-soft);
    text-transform:uppercase;
    font-weight:600;
    padding:10px 26px;
    border-bottom:1px solid var(--line);
    background:#FBF9F4;
  }
  thead th.num{text-align:right;}
  tbody td{
    padding:10px 26px;
    border-bottom:1px solid var(--line);
    font-size:14.5px;
    vertical-align:middle;
  }
  tbody tr:hover{background:#FCFAF5;}
  .cat-cell{display:flex;align-items:center;gap:10px;}
  .cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .cat-name-input{
    border:none;background:transparent;font-size:14.5px;font-weight:600;
    color:var(--ink);width:120px;font-family:inherit;
  }
  .cat-name-input:focus{outline:1px solid var(--sage);border-radius:4px;}
  .desc-input{
    width:100%;border:none;background:transparent;font-size:14px;
    color:var(--ink-soft);font-family:inherit;padding:4px 2px;
  }
  .desc-input:focus{outline:1px solid var(--line);border-radius:4px;color:var(--ink);}
  .amount-cell{text-align:right;}
  .amount-input{
    width:110px;text-align:right;border:1px solid transparent;background:transparent;
    font-size:14.5px;font-weight:600;color:var(--ink);font-family:inherit;
    padding:6px 8px;border-radius:6px;
  }
  .amount-input:focus{border-color:var(--sage);background:#FBF9F4;outline:none;}
  .del-btn{
    border:none;background:none;color:var(--ink-soft);cursor:pointer;
    font-size:18px;line-height:1;padding:4px 8px;border-radius:6px;
  }
  .del-btn:hover{color:var(--danger);background:var(--rose-soft);}
  .actions-cell{text-align:center;width:44px;}

  tfoot td{
    padding:16px 26px;
    font-weight:700;
    font-size:15.5px;
    border-top:2px solid var(--ink);
    background:#FBF9F4;
  }
  tfoot .amount-cell{text-align:right;font-family:"Noto Serif TC",serif;font-size:19px;}

  .add-row-wrap{padding:16px 26px 24px;}
  .add-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--sage-soft);
    color:#4E5C46;
    border:1px dashed var(--sage);
    border-radius:9px;
    padding:9px 16px;
    font-size:13.5px;font-weight:600;
    cursor:pointer;font-family:inherit;
  }
  .add-btn:hover{background:#CFDCC7;}

  /* ---------- Charts ---------- */
  .charts{
    display:grid;
    grid-template-columns: 1.3fr 1fr;
    gap:20px;
    margin-top:32px;
  }
  @media (max-width:780px){ .charts{grid-template-columns:1fr;} }
  .chart-card h3{
    font-family:"Noto Serif TC",serif;
    font-size:17px;margin:0 0 4px;font-weight:600;
  }
  .chart-card p.hint{
    font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;
  }
  .chart-box{position:relative;height:280px;}

  footer{
    text-align:center;
    color:var(--ink-soft);
    font-size:12.5px;
    margin-top:56px;
    line-height:1.8;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="tape"></span>
    <span class="tape t2"></span>
    <div class="eyebrow">居家帳簿 · 每月記錄</div>
    <h1>屋企洗費表
      <svg class="swash" viewBox="0 0 168 10" fill="none"><path d="M2 7C30 2 60 2 84 6C108 10 138 3 166 5" stroke="#C98A7A" stroke-width="3" stroke-linecap="round"/></svg>
    </h1>
    <p class="sub">記低屋企每個月嘅洗費，睇清楚水電煤、餐飲、醫療、服裝、旅行呢啲項目洗咗幾多錢，錢使去邊一眼睇晒。</p>
    <div class="month-row">
      而家記緊嘅係
      <select id="monthSelect"></select>
      <span class="month-year">嘅使費</span>
    </div>
  </header>

  <section class="summary">
    <div class="card stamp-card">
      <div class="stamp-row">
        <div class="stamp" id="stampLabel">7月<br>總洗費</div>
        <div>
          <div class="stamp-label">總共洗咗</div>
          <div class="stamp-value">£ <span id="totalSpent">0</span></div>
        </div>
      </div>
      <div class="budget-input-row">
        set低呢個月嘅預算
        <input id="budgetInput" type="number" min="0" placeholder="例如 3000" />
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-caption">
        <span id="progressText">未set預算</span>
        <span id="remainText"></span>
      </div>
    </div>

    <div class="card breakdown-card">
      <div class="stamp-label">洗費類別一覽</div>
      <div class="mini-legend" id="miniLegend"></div>
    </div>
  </section>

  <section class="card table-card">
    <div class="table-head-row">
      <h2>洗費明細</h2>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:170px;">類別</th>
          <th>備註（唔填都得）</th>
          <th class="num" style="width:150px;">金額 (£)</th>
          <th class="actions-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
      <tfoot>
        <tr>
          <td colspan="2">合共</td>
          <td class="amount-cell">£ <span id="footTotal">0</span></td>
          <td></td>
        </tr>
      </tfoot>
    </table>
    <div class="add-row-wrap">
      <button class="add-btn" id="addRowBtn">＋ 加多個洗費項目</button>
    </div>
  </section>

  <section class="charts">
    <div class="card chart-card">
      <h3>各類別洗費比較</h3>
      <p class="hint">長條圖 · 由多到少排列</p>
      <div class="chart-box"><canvas id="barChart"></canvas></div>
    </div>
    <div class="card chart-card">
      <h3>洗費佔比</h3>
      <p class="hint">圓形圖 · 各類別佔成個月洗費嘅百分比</p>
      <div class="chart-box"><canvas id="pieChart"></canvas></div>
    </div>
  </section>

  <footer>
    資料淨係暫存喺呢版度，一於重新整理就會冇晒，緊要嘅數字記得自己截圖或者抄低。
  </footer>
</div>

<script>
/* ---------- Palette for categories (soft, muted) ---------- */
const PALETTE = ["#8FA083","#C98A7A","#8DA6B2","#D8B675","#A793A6","#B7A38C","#7FA6A0","#CC9E8B","#9AA8C0","#C7AF7D"];

/* ---------- Initial categories ---------- */
let rows = [
  {cat:"租金／供樓", desc:"", amount:0},
  {cat:"水電煤", desc:"", amount:0},
  {cat:"餐飲費", desc:"", amount:0},
  {cat:"交通費", desc:"", amount:0},
  {cat:"醫療費", desc:"", amount:0},
  {cat:"服裝費", desc:"", amount:0},
  {cat:"旅行費", desc:"", amount:0},
  {cat:"教育費", desc:"", amount:0},
  {cat:"保險費", desc:"", amount:0},
  {cat:"日用品雜貨", desc:"", amount:0},
  {cat:"電話上網費", desc:"", amount:0},
  {cat:"娛樂消閒", desc:"", amount:0},
];

/* ---------- Month selector ---------- */
const MONTH_NAMES = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const monthSelect = document.getElementById('monthSelect');
const stampLabel = document.getElementById('stampLabel');
const now = new Date();
const currentMonthIdx = now.getMonth(); // 0-based, e.g. July -> 6
MONTH_NAMES.forEach((m, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = m;
  if(i === currentMonthIdx) opt.selected = true;
  monthSelect.appendChild(opt);
});
function updateMonthStamp(){
  const label = MONTH_NAMES[+monthSelect.value];
  stampLabel.innerHTML = `${label}<br>總洗費`;
}
monthSelect.addEventListener('change', updateMonthStamp);
updateMonthStamp();

const tableBody = document.getElementById('tableBody');
const footTotal = document.getElementById('footTotal');
const totalSpent = document.getElementById('totalSpent');
const budgetInput = document.getElementById('budgetInput');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const remainText = document.getElementById('remainText');
const miniLegend = document.getElementById('miniLegend');

let barChart, pieChart;

function colorFor(i){ return PALETTE[i % PALETTE.length]; }

function fmt(n){
  return Math.round(n).toLocaleString('en-US');
}

function render(){
  tableBody.innerHTML = "";
  rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="cat-cell">
          <span class="cat-dot" style="background:${colorFor(i)}"></span>
          <input class="cat-name-input" value="${escapeHtml(r.cat)}" data-idx="${i}" data-field="cat" />
        </div>
      </td>
      <td><input class="desc-input" placeholder="想寫咩就寫咩…" value="${escapeHtml(r.desc)}" data-idx="${i}" data-field="desc" /></td>
      <td class="amount-cell"><input class="amount-input" type="number" min="0" value="${r.amount || ''}" placeholder="0" data-idx="${i}" data-field="amount" /></td>
      <td class="actions-cell"><button class="del-btn" data-idx="${i}" title="刪走">×</button></td>
    `;
    tableBody.appendChild(tr);
  });

  // bind events
  tableBody.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', onFieldChange);
  });
  tableBody.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      rows.splice(+btn.dataset.idx, 1);
      render();
      updateAll();
    });
  });

  updateAll();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function onFieldChange(e){
  const idx = +e.target.dataset.idx;
  const field = e.target.dataset.field;
  if(field === 'amount'){
    rows[idx].amount = parseFloat(e.target.value) || 0;
  } else {
    rows[idx][field] = e.target.value;
  }
  if(field === 'cat'){
    // update legend dot label live without full re-render (avoid losing focus)
    updateAll();
  } else {
    updateAll();
  }
}

function updateAll(){
  const total = rows.reduce((s,r)=> s + (Number(r.amount)||0), 0);
  footTotal.textContent = fmt(total);
  totalSpent.textContent = fmt(total);

  // budget progress
  const budget = parseFloat(budgetInput.value) || 0;
  if(budget > 0){
    const pct = Math.min(100, (total/budget)*100);
    progressFill.style.width = pct + "%";
    progressFill.classList.toggle('over', total > budget);
    progressText.textContent = `已經洗咗 ${pct.toFixed(0)}%`;
    remainText.textContent = total > budget
      ? `使爆咗 £ ${fmt(total-budget)}`
      : `仲剩返 £ ${fmt(budget-total)}`;
  } else {
    progressFill.style.width = "0%";
    progressFill.classList.remove('over');
    progressText.textContent = "未set預算";
    remainText.textContent = "";
  }

  // legend
  miniLegend.innerHTML = rows.map((r,i)=>`
    <span class="mini-legend-item">
      <span class="dot" style="background:${colorFor(i)}"></span>${escapeHtml(r.cat || '未改名')}
    </span>
  `).join('');

  updateCharts();
}

function updateCharts(){
  const labels = rows.map(r => r.cat || '未改名');
  const data = rows.map(r => Number(r.amount)||0);
  const colors = rows.map((_,i)=> colorFor(i));

  // sort for bar chart (desc)
  const sortedIdx = data.map((v,i)=>i).sort((a,b)=> data[b]-data[a]);
  const barLabels = sortedIdx.map(i=>labels[i]);
  const barData = sortedIdx.map(i=>data[i]);
  const barColors = sortedIdx.map(i=>colors[i]);

  if(!barChart){
    barChart = new Chart(document.getElementById('barChart'), {
      type: 'bar',
      data:{ labels: barLabels, datasets:[{ data: barData, backgroundColor: barColors, borderRadius:6, maxBarThickness:34 }]},
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => `£ ${fmt(ctx.parsed.y||ctx.parsed.x||0)}` } } },
        scales:{
          y:{ beginAtZero:true, grid:{color:'#EEE8DC'}, ticks:{ font:{family:"'Noto Sans TC'"}, color:'#8A8271' } },
          x:{ grid:{display:false}, ticks:{ font:{family:"'Noto Sans TC'", size:11}, color:'#8A8271' } }
        }
      }
    });
  } else {
    barChart.data.labels = barLabels;
    barChart.data.datasets[0].data = barData;
    barChart.data.datasets[0].backgroundColor = barColors;
    barChart.update();
  }

  if(!pieChart){
    pieChart = new Chart(document.getElementById('pieChart'), {
      type:'doughnut',
      data:{ labels, datasets:[{ data, backgroundColor: colors, borderColor:'#FFFFFF', borderWidth:2 }]},
      options:{
        responsive:true, maintainAspectRatio:false,
        cutout:'58%',
        plugins:{
          legend:{ display:false },
          tooltip:{ callbacks:{ label: ctx => {
            const tot = ctx.dataset.data.reduce((a,b)=>a+b,0) || 1;
            const pct = (ctx.parsed/tot*100).toFixed(1);
            return `${ctx.label}: £ ${fmt(ctx.parsed)} (${pct}%)`;
          }}}
        }
      }
    });
  } else {
    pieChart.data.labels = labels;
    pieChart.data.datasets[0].data = data;
    pieChart.data.datasets[0].backgroundColor = colors;
    pieChart.update();
  }
}

document.getElementById('addRowBtn').addEventListener('click', ()=>{
  rows.push({cat:"新增類別", desc:"", amount:0});
  render();
});
budgetInput.addEventListener('input', updateAll);

render();
</script>
</body>
</html>
